<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
</head>
<body>
<title>ShelfLife Web</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: web app = sticky left nav · main column · optional design-notes column (≥1240px, else overlay).
   Under 760px the nav becomes a bottom tab bar and drawers become bottom sheets.
   Matcha = product accent. Violet = the annotation layer (demo bar, R-tags, notes); it is never part of the product. */
:root{
  --app-bg:#F4F7F1; --side:#FFFFFF; --surface:#FFFFFF; --surface-2:#ECF1E8; --line:#D3DBD0;
  --ink:#162018; --muted:#5B695E;
  --matcha:#4C792C; --on-matcha:#FFFFFF; --matcha-soft:#DCE9CE;
  --urgent:#B23A25; --urgent-soft:#F7E0D9; --soon:#8F5C0C; --soon-soft:#F4E8CF;
  --frost:#2C6890; --frost-soft:#DAE9F3; --wood:#7C5A30; --wood-soft:#F0E6D8;
  --appl:#FBFCFB; --appl-edge:#C9D3CE; --cold-in:#E6F1F6; --cold-in2:#F5FAFC; --glass:#BCD5E1; --crisper:#D9E9F0; --lock-stripe:#E3E8E1;
  --anno:#6843C6; --anno-soft:#ECE6FB; --anno-line:#D5C9F5;
  --paper:#FFFFFF; --paper-ink:#1F2320; --paper-hl:#FFE7A3;
  --scrim:rgba(14,20,16,.42); --toast-bg:#1C251F; --toast-fg:#F1F5F0; --shadow:rgba(20,30,22,.22);
  --f-display:"Bricolage Grotesque","PingFang SC","Hiragino Sans GB",system-ui,sans-serif;
  --f-body:"Figtree","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --app-bg:#101511; --side:#161C17; --surface:#19201B; --surface-2:#222B24; --line:#2C362E;
    --ink:#E7EDE7; --muted:#97A59A;
    --matcha:#A0CB70; --on-matcha:#12200A; --matcha-soft:#25351B;
    --urgent:#F0846B; --urgent-soft:#3A1E18; --soon:#E0B354; --soon-soft:#342814;
    --frost:#8CC2E5; --frost-soft:#16293A; --wood:#D2B48A; --wood-soft:#2E261C;
    --appl:#1B221E; --appl-edge:#3A4640; --cold-in:#12202A; --cold-in2:#172832; --glass:#2D4654; --crisper:#18303C; --lock-stripe:#222A24;
    --anno:#B8A1F6; --anno-soft:#251E39; --anno-line:#3D3260;
    --scrim:rgba(0,0,0,.6); --toast-bg:#E5ECE5; --toast-fg:#132016; --shadow:rgba(0,0,0,.55);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --app-bg:#101511; --side:#161C17; --surface:#19201B; --surface-2:#222B24; --line:#2C362E;
  --ink:#E7EDE7; --muted:#97A59A;
  --matcha:#A0CB70; --on-matcha:#12200A; --matcha-soft:#25351B;
  --urgent:#F0846B; --urgent-soft:#3A1E18; --soon:#E0B354; --soon-soft:#342814;
  --frost:#8CC2E5; --frost-soft:#16293A; --wood:#D2B48A; --wood-soft:#2E261C;
    --appl:#1B221E; --appl-edge:#3A4640; --cold-in:#12202A; --cold-in2:#172832; --glass:#2D4654; --crisper:#18303C; --lock-stripe:#222A24;
  --anno:#B8A1F6; --anno-soft:#251E39; --anno-line:#3D3260;
  --scrim:rgba(0,0,0,.6); --toast-bg:#E5ECE5; --toast-fg:#132016; --shadow:rgba(0,0,0,.55);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--app-bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--anno);outline-offset:2px}

/* ---------- demo bar (annotation layer) ---------- */
.demo{background:var(--anno-soft);border-bottom:1px solid var(--anno-line);color:var(--ink);padding-inline:16px;padding-block:8px;display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;font-size:13px}
.demo-tag{font:600 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--anno)}
.dg{display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-width:0}
.dl{color:var(--muted)}
.dchip{border:1px solid var(--anno-line);background:var(--surface);border-radius:20px;padding:3px 11px;font-weight:600;font-size:13px;cursor:pointer}
.dchip.on{background:var(--anno);border-color:var(--anno);color:var(--surface)}
.dnum{width:26px;height:26px;border-radius:50%;border:1px solid var(--anno-line);background:var(--surface);font:600 12px var(--f-mono);cursor:pointer;padding:0}
.dnum.on{background:var(--anno);border-color:var(--anno);color:var(--surface)}
.dstep{color:var(--ink);min-width:0;flex:1 1 260px}
.dstep b{font-weight:600}
.dsw{display:flex;align-items:center;gap:6px;cursor:pointer}
.dsw input{accent-color:var(--anno);width:16px;height:16px}
.dbtn{border:1px solid var(--anno-line);background:var(--surface);border-radius:8px;padding:3px 10px;font-size:13px;cursor:pointer}
.dbtn.on{border-color:var(--anno);color:var(--anno);font-weight:600}
.demo-pill{position:fixed;left:14px;bottom:14px;z-index:90;border:1px solid var(--anno-line);background:var(--anno-soft);color:var(--anno);font:600 12px var(--f-body);padding:6px 12px;border-radius:20px;cursor:pointer;box-shadow:0 6px 16px -8px var(--shadow)}

/* ---------- app frame ---------- */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh;min-height:100dvh}
.app.with-notes{grid-template-columns:236px minmax(0,1fr) 340px}
.side{background:var(--side);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;height:100dvh;display:flex;flex-direction:column;padding:20px 14px 16px;gap:4px}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 18px}
.brand svg{width:32px;height:32px;flex:none}
.brand b{font:700 21px var(--f-display);letter-spacing:-.01em}
.nav{display:flex;flex-direction:column;gap:2px}
.nv{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:11px;border:0;background:none;text-align:left;cursor:pointer;font-weight:500;color:var(--muted)}
.nv:hover{background:var(--surface-2);color:var(--ink)}
.nv.on{background:var(--matcha-soft);color:var(--ink);font-weight:700}
.nv.on svg{color:var(--matcha)}
.nv svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.nv .s{display:none}
.nv .badge{margin-left:auto;font:600 11px var(--f-mono);background:var(--urgent-soft);color:var(--urgent);border-radius:10px;padding:1px 7px}
.me{margin-top:auto;display:flex;gap:10px;align-items:center;padding:10px;border-radius:14px;background:var(--surface-2)}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font:700 14px var(--f-display);background:var(--matcha);color:var(--on-matcha);flex:none}
.av.alt{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.me small{display:block;color:var(--muted);font-size:12px;line-height:1.3}
.me b{font-weight:700}

.main{min-width:0;padding-inline:clamp(16px,3.4vw,40px);padding-block:26px 90px}
.wrap{max-width:1080px;margin:0 auto}
.phead{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end;justify-content:space-between;margin-bottom:22px}
.eyebrow{font:500 12px var(--f-mono);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin:0}
.ph1{font:700 clamp(28px,3.6vw,38px)/1.06 var(--f-display);letter-spacing:-.02em;margin:4px 0 0;text-wrap:balance}
.psub{color:var(--muted);margin:6px 0 0;max-width:62ch}
.cols2{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:22px;align-items:start}
.stack{display:flex;flex-direction:column;gap:22px;min-width:0}
.sec-h{display:flex;align-items:center;gap:8px;margin:0 2px 9px}
.sec-h h2{font:700 12px var(--f-body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0}
.sec-h .r{margin-left:auto;font-size:13px;color:var(--muted)}
.rq{display:inline-block;font:600 10px/1 var(--f-mono);padding:3px 5px;border-radius:5px;background:var(--anno-soft);color:var(--anno);border:1px solid var(--anno-line);letter-spacing:.03em;vertical-align:middle;margin-left:4px}
.tags-off .rq{display:none}
.tags-off .notes .rq,.tags-off .demo .rq{display:inline-block}

/* rows & chips */
.rows{list-style:none;margin:0;padding:0;background:var(--surface);border-radius:16px;border:1px solid var(--line);overflow:hidden}
.rows li+li{border-top:1px solid var(--line)}
.row{width:100%;display:flex;align-items:center;gap:12px;padding:12px 16px;background:none;border:0;text-align:left;cursor:pointer}
.row:hover{background:var(--surface-2)}
.r-main{flex:1;min-width:0;display:flex;flex-direction:column}
.r-main b{font-weight:600}
.r-main small{color:var(--muted);font-size:13px;line-height:1.35}
.chip{flex:none;font:500 12px/1 var(--f-mono);padding:6px 9px;border-radius:9px;white-space:nowrap;border:1.5px solid transparent;display:inline-flex;flex-direction:column;align-items:flex-end;gap:3px;font-variant-numeric:tabular-nums}
.chip i{font-style:normal;font-size:9px;letter-spacing:.07em;text-transform:uppercase;opacity:.75}
.c-urgent{background:var(--urgent-soft);color:var(--urgent)}
.c-soon{background:var(--soon-soft);color:var(--soon)}
.c-plain{background:var(--surface-2);color:var(--ink)}
.c-est{background:transparent;border:1.5px dashed var(--muted);color:var(--ink)}
.c-est.u{border-color:var(--urgent);color:var(--urgent)}
.c-est.s{border-color:var(--soon);color:var(--soon)}
.c-frost{background:var(--frost-soft);color:var(--frost)}
.c-frost.c-old{border-color:var(--frost)}
.c-none{background:transparent;color:var(--muted);border:1px solid var(--line)}
.legend-dates{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font-size:12.5px;color:var(--muted);margin-top:10px}
.legend-dates .chip{flex-direction:row;padding:3px 7px}

/* cards & controls */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.card.tint{background:var(--matcha-soft);border-color:transparent}
.card.warn{background:var(--soon-soft);border-color:transparent}
.card p{margin:0}
.card .t{font-weight:700;font-size:16px;margin-bottom:4px}
.muted{color:var(--muted)}
.btn{font-weight:600;font-size:14px;padding:9px 15px;border-radius:11px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.btn.pri{background:var(--matcha);color:var(--on-matcha);border-color:var(--matcha)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:9px}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.mini{font-weight:600;font-size:12.5px;border:1px solid var(--line);background:var(--surface);padding:5px 10px;border-radius:9px;cursor:pointer;white-space:nowrap}
.mini.ok{background:var(--matcha);border-color:var(--matcha);color:var(--on-matcha)}
.link{background:none;border:0;padding:0;color:var(--matcha);font-weight:600;cursor:pointer}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.pill{font-size:13px;font-weight:500;padding:5px 11px;border-radius:20px;background:var(--surface);border:1px solid var(--line)}
.banner{background:var(--matcha-soft);border-radius:16px;padding:14px 16px;margin-bottom:20px;display:flex;flex-direction:column;gap:10px}
.banner p{margin:0}
.banner .w{background:var(--surface);border-radius:12px;padding:10px 12px;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between}
.banner .w b{color:var(--soon)}
.seg{display:inline-flex;background:var(--surface-2);border-radius:12px;padding:3px;gap:3px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:7px 14px;border-radius:9px;font-weight:600;font-size:13.5px;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px var(--shadow)}
.fchip{border:1px solid var(--line);background:none;padding:5px 12px;border-radius:20px;font-weight:500;font-size:13px;cursor:pointer}
.fchip.on{background:var(--ink);color:var(--app-bg);border-color:var(--ink)}
.toolbar{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;margin-bottom:14px}
.search{flex:1 1 200px;max-width:280px;border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:8px 12px;font-size:14px}

/* space bars */
.space{list-style:none;margin:0;padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.space li{display:grid;grid-template-columns:1fr auto;gap:5px 10px;align-items:center;font-size:14px}
.space li span{font-weight:600}
.space li span small{font-weight:400;color:var(--muted)}
.space li em{font-style:normal;font:500 12px var(--f-mono);color:var(--muted);text-align:right}
.bar{grid-column:1 / -1;height:8px;border-radius:6px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--matcha);border-radius:6px}
.bar.hi i{background:var(--soon)}

/* food table */
.ftable{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.fh,.fr{display:grid;grid-template-columns:minmax(0,2.1fr) minmax(0,1.3fr) minmax(0,.8fr) minmax(0,1.1fr) 168px;gap:12px;align-items:center;padding:11px 16px}
.fh{font:700 11.5px var(--f-body);text-transform:uppercase;letter-spacing:.07em;color:var(--muted);background:var(--surface-2)}
.fr{width:100%;border:0;border-top:1px solid var(--line);background:none;text-align:left;cursor:pointer}
.fh+.fr{border-top:0}
.fr:hover{background:var(--surface-2)}
.fr .fn b{font-weight:600}
.fr .fn small{display:none;color:var(--muted);font-size:13px}
.fr .fn b{display:block}
.fr .fx{color:var(--muted);font-size:14px;min-width:0}
.fr .chip{justify-self:end}
.fr.other{cursor:default;color:var(--muted)}
.fr.other:hover{background:none}
.lock{justify-self:end;font:500 10.5px var(--f-mono);text-transform:uppercase;letter-spacing:.05em;color:var(--muted);border:1px solid var(--line);padding:4px 7px;border-radius:6px}

/* add */
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:12px}
.mth{display:flex;flex-direction:column;gap:10px;padding:16px;border-radius:16px;border:1px solid var(--line);background:var(--surface);text-align:left;cursor:pointer;min-width:0}
.mth:hover{border-color:var(--matcha)}
.mth.main{border-color:var(--matcha);box-shadow:inset 0 0 0 1px var(--matcha)}
.mth .ic{width:42px;height:42px;border-radius:12px;background:var(--matcha-soft);color:var(--matcha);display:grid;place-items:center}
.mth .ic svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.mth b{font-size:16px}
.mth small{color:var(--muted);font-size:13.5px}

/* receipt */
.rcgrid{display:grid;grid-template-columns:290px minmax(0,1fr);gap:28px;align-items:start}
.paper{background:var(--paper);color:var(--paper-ink);font:500 11.5px/1.65 var(--f-mono);padding:20px 16px 22px;border-radius:4px;box-shadow:0 14px 30px -18px var(--shadow),0 0 0 1px var(--line);position:sticky;top:20px;transform:rotate(-.6deg)}
.ptop{text-align:center;font-weight:500;letter-spacing:.06em}
.pdash{border-top:1.5px dashed var(--paper-ink);opacity:.4;margin:10px 0}
.pline{display:flex;justify-content:space-between;gap:10px;padding:1px 5px;border-radius:3px}
.pline span:first-child{min-width:0;overflow-wrap:anywhere}
.pline.flag span:first-child{text-decoration:underline wavy;text-decoration-color:#C77E10;text-underline-offset:3px}
.pline.hl{background:var(--paper-hl)}
.pline.tot{font-weight:700}
.pfoot{text-align:center;margin-top:10px;opacity:.7}
.rc{padding:13px 16px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 14px;align-items:center}
.rc.need{background:var(--soon-soft)}
.rc code{font:500 11px var(--f-mono);color:var(--muted);grid-column:1 / -1}
.rc .name{font-weight:700}
.rc .name small{font-weight:400;color:var(--muted)}
.rc .ctl{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.rc .full{grid-column:1 / -1;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.rc .hint{font-size:13px;color:var(--soon);font-weight:600}
.split{display:flex;align-items:center;gap:8px;font-size:13.5px;cursor:pointer}
.split input{width:17px;height:17px;accent-color:var(--matcha)}
.confirm{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-top:14px}

/* plan */
.weekwrap{overflow-x:auto;padding-bottom:6px}
.weekgrid{display:grid;grid-template-columns:repeat(7,minmax(126px,1fr));gap:8px}
.dcol{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:7px;min-height:200px;min-width:0}
.dcol.today{border-color:var(--matcha);box-shadow:inset 0 0 0 1px var(--matcha)}
.dcol.past{opacity:.48}
.dcol.off{background:var(--surface-2)}
.dhead{display:flex;justify-content:space-between;align-items:baseline;gap:4px}
.dhead small{color:var(--muted);font-size:12px}
.dhead b{font:700 17px var(--f-display);font-variant-numeric:tabular-nums}
.tag{font:600 9.5px var(--f-mono);text-transform:uppercase;letter-spacing:.05em;color:var(--matcha)}
.dsel{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:4px 6px;font-size:12.5px;font-weight:600}
.dsel.m-out{color:var(--soon)} .dsel.m-busy{color:var(--urgent)} .dsel.m-cook{color:var(--matcha)}
.fpill{display:flex;flex-direction:column;gap:1px;font-size:13px;padding:7px 9px;border-radius:10px;background:var(--surface-2);border:0;text-align:left;cursor:pointer;min-width:0}
.dcol.off .fpill{background:var(--surface)}
.fpill b{font-weight:600;overflow-wrap:break-word}
.fpill small{font:500 11px var(--f-mono)}
.t-u{color:var(--urgent)} .t-s{color:var(--soon)} .t-f{color:var(--frost)} .t-n{color:var(--muted)}
.dempty{font-size:12.5px;color:var(--muted);margin:2px 0 0}
.loose{display:flex;align-items:center;gap:12px;padding:11px 16px}
.loose select{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:5px 8px;font-size:13px}

/* shop */
.srow{display:flex;align-items:center;gap:12px;padding:11px 16px}
.tick{width:22px;height:22px;border-radius:7px;border:1.5px solid var(--muted);background:none;flex:none;cursor:pointer;display:grid;place-items:center;padding:0}
.srow.done .tick{background:var(--matcha);border-color:var(--matcha)}
.srow.done .tick::after{content:"";width:9px;height:5px;border:2px solid var(--on-matcha);border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.srow.done b{text-decoration:line-through;color:var(--muted)}
.addrow{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}
.addrow input{flex:1;min-width:0;border:1px solid var(--line);background:var(--app-bg);border-radius:10px;padding:8px 12px;font-size:14px}
.sugg{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;align-items:center;font-size:13px;color:var(--muted)}

/* settings */
.set{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.set li{display:flex;gap:14px;align-items:center;padding:13px 16px}
.set li+li{border-top:1px solid var(--line)}
.set .r-main small{font-size:13px}
.tgl{width:44px;height:26px;border-radius:14px;border:0;background:var(--line);position:relative;cursor:pointer;flex:none;padding:0}
.tgl::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px var(--shadow);transition:left .15s}
.tgl.on{background:var(--matcha)}
.tgl.on::after{left:21px}
.tgl:disabled{opacity:.55;cursor:not-allowed}
.never{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:5px;font-size:14px}
.never li{padding-left:22px;position:relative}
.never li::before{content:"✕";position:absolute;left:2px;color:var(--urgent);font:600 13px var(--f-mono)}
.members{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.mem{display:flex;gap:8px;align-items:center}
.shelf{display:grid;grid-template-columns:90px minmax(0,1fr) 90px;gap:10px;align-items:center;font-size:14px;padding:4px 0}
.shelf .bar{grid-column:auto}
.shelf em{font:500 12px var(--f-mono);font-style:normal;color:var(--muted);text-align:right}

/* notes column (annotation) */
.notes{background:var(--anno-soft);border-left:1px solid var(--anno-line);padding:22px 20px 60px;position:sticky;top:0;height:100vh;height:100dvh;overflow-y:auto;min-width:0}
.notes .nclose{display:none}
.ntabs{display:flex;gap:4px;margin-bottom:16px}
.ntabs button{border:1px solid var(--anno-line);background:var(--surface);border-radius:8px;padding:4px 10px;font-size:13px;cursor:pointer}
.ntabs button.on{background:var(--anno);border-color:var(--anno);color:var(--surface);font-weight:600}
.nlab{font:700 11.5px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--anno);margin:20px 0 8px}
.notes h3{font:700 23px/1.15 var(--f-display);margin:0 0 6px;letter-spacing:-.01em}
.notes p{margin:0 0 6px;font-size:14px}
.rtags{display:flex;flex-direction:column;gap:5px;margin:10px 0 12px}
.rtag{display:flex;gap:8px;align-items:baseline;font-size:13.5px}
.rtag .rq{margin:0;flex:none}
.ev{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;font-size:13.5px}
.ev li{border-left:2px solid var(--anno);padding-left:10px}
.todo{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:7px;font-size:13.5px}
.todo li{padding-left:22px;position:relative}
.todo li::before{content:"";position:absolute;left:2px;top:4px;width:11px;height:11px;border:1.5px solid var(--anno);border-radius:3px}
.notes ul.plain{margin:0;padding-left:18px;font-size:13.5px;display:flex;flex-direction:column;gap:5px}
.ntbl{width:100%;border-collapse:collapse;font-size:13px}
.ntbl td{padding:5px 8px 5px 0;border-bottom:1px solid var(--anno-line);vertical-align:top}
.ntbl td:first-child{font:500 12px var(--f-mono);white-space:nowrap;color:var(--anno)}

/* overlays */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:60}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(430px,100%);background:var(--app-bg);z-index:61;overflow-y:auto;padding:22px 24px 40px;box-shadow:-24px 0 48px -24px var(--shadow);animation:slide .2s ease-out}
.drawer .x{position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:18px;line-height:1}
.grab{display:none}
@keyframes slide{from{transform:translateX(30px);opacity:.6}to{transform:none;opacity:1}}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
.sh-t{font:700 24px/1.15 var(--f-display);margin:0 40px 0 0;letter-spacing:-.01em}
.sh-sub{color:var(--muted);font-size:14px;margin:4px 0 0}
.datebox{border-radius:16px;padding:13px 15px;margin-top:16px;border:1.5px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:9px;align-items:flex-start}
.datebox.est{border-style:dashed;border-color:var(--muted)}
.datebox.frozen{background:var(--frost-soft);border-color:transparent}
.datebox p{margin:0;font-size:14px}
.planline{margin-top:12px;font-size:14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dsec{margin-top:20px}
.acts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
.act{border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:10px 4px;font-weight:600;font-size:13px;cursor:pointer}
.act:disabled{opacity:.4;cursor:not-allowed}
.tip{margin-top:18px;font-size:14px;background:var(--surface-2);border-radius:14px;padding:11px 13px}
.tip b{display:block;font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:3px}
.tip em{font-style:normal;font:500 10px var(--f-mono);text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:1px 4px;margin-left:6px}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.opt{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px;cursor:pointer;display:flex;flex-direction:column}
.opt:hover{border-color:var(--matcha)}
.opt small{color:var(--muted);font-size:13px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.pv{margin:0;padding:0;list-style:none;font-size:14px;display:flex;flex-direction:column;gap:6px}
.pv li{padding-left:22px;position:relative}
.pv li::before{position:absolute;left:0;top:0;font:600 13px var(--f-mono)}
.pv li.y::before{content:"✓";color:var(--matcha)}
.pv li.n::before{content:"✕";color:var(--urgent)}
.flab{font:700 11.5px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
.fld{display:flex;flex-direction:column;gap:4px;margin-top:14px;font-size:13px;font-weight:600}
.fld input,.fld select{border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:10px 12px;font-size:15px;font-weight:400}
.small{font-size:13px;color:var(--muted);margin:14px 0 0}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:80;width:max-content;max-width:calc(100% - 32px);background:var(--toast-bg);color:var(--toast-fg);border-radius:13px;padding:11px 16px;display:flex;gap:14px;align-items:center;font-size:14px;box-shadow:0 12px 28px -12px var(--shadow)}
.toast button{background:none;border:0;color:inherit;font-weight:700;text-decoration:underline;cursor:pointer;flex:none}
.notif{position:fixed;top:16px;right:16px;z-index:75;width:min(370px,calc(100% - 32px));background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:13px 15px;display:flex;gap:12px;text-align:left;cursor:pointer;box-shadow:0 20px 44px -18px var(--shadow);animation:up .25s ease-out}
.appic{width:40px;height:40px;border-radius:11px;background:var(--matcha);color:var(--on-matcha);display:grid;place-items:center;flex:none}
.appic svg{width:26px;height:26px}
.nbody{display:flex;flex-direction:column;gap:1px;font-size:14px;min-width:0}
.nmeta{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.nmeta b{color:var(--ink);font-weight:600}
.ntitle{font-weight:700;font-size:15px}

/* icons: food = emoji on a neutral tile; places & settings = line icons tinted by kind */
.fi{width:38px;height:38px;border-radius:11px;background:var(--surface-2);display:grid;place-items:center;font-size:21px;line-height:1;flex:none;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.fi.sm{width:28px;height:28px;font-size:16px;border-radius:8px}
.fi.lg{width:56px;height:56px;font-size:32px;border-radius:16px;background:var(--surface)}
.fe{font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;font-weight:400;margin-right:4px}
.pi{width:30px;height:30px;border-radius:9px;display:inline-grid;place-items:center;flex:none;background:var(--matcha-soft);color:var(--matcha);vertical-align:middle}
.pi.frozen{background:var(--frost-soft);color:var(--frost)}
.pi.room{background:var(--wood-soft);color:var(--wood)}
.pi.muted{background:var(--surface-2);color:var(--muted)}
.pi.sm{width:22px;height:22px;border-radius:6px}
.pi svg,.li svg,.li{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.pi svg{width:18px;height:18px}
.pi.sm svg{width:14px;height:14px}
.li{width:20px;height:20px;flex:none;color:var(--muted)}
.seg .pi{margin-right:6px;background:transparent;width:18px;height:18px}
.seg button{display:inline-flex;align-items:center}
.space li span{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dhead .li{width:16px;height:16px}
.dhead .m-cook{color:var(--matcha)} .dhead .m-out{color:var(--soon)} .dhead .m-busy{color:var(--urgent)}
.fn{display:flex;align-items:center;gap:12px;min-width:0}
.fn>span{display:flex;flex-direction:column;min-width:0}
.dh{display:flex;gap:14px;align-items:center;margin-right:40px}
.dh .sh-t{margin:0}
.place .pn-wrap{display:flex;gap:8px;align-items:center;min-width:0}
.place .pn-wrap input{flex:1;min-width:0}
.pill{display:inline-flex;align-items:center;gap:2px}

/* AI badge, editable receipt lines, email + photo sources */
.aib{display:inline-block;font:600 10px/1 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--matcha);border:1.5px solid var(--matcha);border-radius:6px;padding:3px 6px;vertical-align:middle;margin:0 4px 0 0;white-space:nowrap}
.aib.inv{color:var(--toast-fg);border-color:var(--toast-fg)}
.mth b .aib{margin:0 0 0 6px}
.how{margin:14px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.checks{display:flex;flex-direction:column;gap:7px;font-size:14px}
.checks input{accent-color:var(--matcha);width:16px;height:16px;margin-right:8px;vertical-align:-3px}
.rc.editing{display:block;background:var(--surface-2)}
.edit{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 12px}
.edit .fld{margin-top:10px}
.edit .wide{grid-column:1 / -1}
.edit .fld input,.edit .fld select{font-size:14px;padding:8px 10px}
.rc.skipped{opacity:.6}
.rc.skipped s{margin-right:6px}
.mail{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;position:sticky;top:20px;font-size:13.5px}
.mail .mh{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:13px}
.mail .mh span{color:var(--muted)}
.mail .ms{font-weight:700;font-size:15px;margin:6px 0 10px}
.mline{display:flex;justify-content:space-between;gap:10px;padding:5px 6px;border-radius:6px;border-top:1px solid var(--line)}
.mline span:first-child{min-width:0;overflow-wrap:break-word}
.mline.tot{font-weight:700}
.mline.hl{background:var(--paper-hl);color:var(--paper-ink)}
.mf{margin:10px 0 0;font-size:12.5px;color:var(--muted)}
.shot.photo{position:sticky;top:20px;margin-top:0}
.pmark circle{fill:#1F2320;stroke:#FFFFFF;stroke-width:2}
.pmark text{fill:#FFFFFF;font:700 13px var(--f-body)}
.pmark.hl circle{fill:#4C792C}

/* picture view of storage places */
.vtools{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;margin-bottom:14px}
.viz-h{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;margin-bottom:10px;font-size:14px}
.viz-h>span{display:flex;align-items:center;gap:8px}
.vizwrap{display:flex;flex-direction:column;gap:14px;max-width:700px}
.fridge{display:grid;grid-template-columns:minmax(0,1fr) 150px;gap:10px;background:var(--appl);border:2px solid var(--appl-edge);border-radius:24px;padding:12px;box-shadow:0 22px 40px -28px var(--shadow)}
.f-in{background:linear-gradient(180deg,var(--cold-in) 0%,var(--cold-in2) 100%);border-radius:15px;padding:6px 10px 10px;min-width:0}
.shelf-row{min-height:92px;border-bottom:5px solid var(--glass);padding:8px 2px 8px;display:flex;flex-direction:column;gap:6px;min-width:0}
.shelf-row.plain{border-bottom:0;min-height:0}
.sl{font:600 10.5px var(--f-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.toks{display:flex;flex-wrap:wrap;gap:8px 6px;align-items:flex-end;min-height:62px}
.toks .none{font-size:12.5px;color:var(--muted);align-self:center}
.crisper{margin-top:10px;border:2px solid var(--glass);border-radius:12px;background:var(--crisper);padding:4px 8px 8px}
.f-door{background:linear-gradient(180deg,var(--cold-in) 0%,var(--cold-in2) 100%);border-radius:15px;padding:8px;display:flex;flex-direction:column;gap:10px;box-shadow:inset 3px 0 0 var(--appl-edge);min-width:0}
.door-bin{border-bottom:6px solid var(--glass);border-radius:0 0 10px 10px;min-height:86px;padding:4px 2px;display:flex;flex-wrap:wrap;gap:6px;align-items:flex-end;justify-content:center}
.tok{width:62px;display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:0;padding:0;cursor:pointer;color:var(--ink)}
.tok .fi{width:46px;height:46px;border-radius:50%;background:var(--surface);font-size:25px;box-shadow:0 0 0 2px var(--line)}
.tok:hover .fi{transform:translateY(-2px)}
.tok.u .fi{box-shadow:0 0 0 3px var(--urgent)}
.tok.s .fi{box-shadow:0 0 0 3px var(--soon)}
.tok.e .fi{box-shadow:none;outline:2.5px dashed var(--muted);outline-offset:1px}
.tok.e.u .fi{outline-color:var(--urgent)} .tok.e.s .fi{outline-color:var(--soon)}
.tok.f .fi{box-shadow:0 0 0 3px var(--frost)}
.tok small{font-size:11px;line-height:1.2;text-align:center;max-width:62px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tok.dim{opacity:.22}
.locked{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px;background:repeating-linear-gradient(135deg,transparent 0 8px,var(--lock-stripe) 8px 16px);border-radius:10px;padding:10px 12px;min-height:62px}
.locked b{color:var(--ink)}
.freezer{background:var(--appl);border:2px solid var(--appl-edge);border-radius:20px;padding:10px;display:flex;flex-direction:column;gap:10px;box-shadow:0 22px 40px -28px var(--shadow)}
.drawer-v{background:var(--frost-soft);border-radius:12px;padding:4px 10px 8px;box-shadow:inset 0 -6px 0 var(--appl-edge)}
.cab{background:var(--wood-soft);border:2px solid var(--wood);border-radius:16px;padding:6px 12px 10px;box-shadow:0 22px 40px -28px var(--shadow)}
.cab .shelf-row{border-bottom-color:var(--wood)}
.cab .shelf-row:last-child{border-bottom:0}
.vleg{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:13px;color:var(--muted)}
.vleg span{display:flex;align-items:center;gap:10px}
.vleg i{width:22px;height:22px;border-radius:50%;background:var(--surface);flex:none;box-shadow:0 0 0 2px var(--line)}
.vleg i.u{box-shadow:0 0 0 3px var(--urgent)} .vleg i.s{box-shadow:0 0 0 3px var(--soon)} .vleg i.f{box-shadow:0 0 0 3px var(--frost)} .vleg i.e{box-shadow:none;outline:2.5px dashed var(--muted)}

/* account + sign-in */
.me{border:0;width:100%;text-align:left;cursor:pointer;color:inherit}
.me:hover,.me.on{background:var(--matcha-soft)}
.app.authmode{grid-template-columns:minmax(0,1fr)}
.app.authmode.with-notes{grid-template-columns:minmax(0,1fr) 340px}
.app.authmode .side{display:none}
.auth{max-width:460px;margin:5vh auto 0;background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:28px 26px}
.auth .bl{display:flex;align-items:center;gap:12px;margin-bottom:18px;font:700 22px var(--f-display)}
.auth .bl svg{width:42px;height:42px}
.auth h1{font:700 28px/1.12 var(--f-display);margin:0 0 8px;letter-spacing:-.015em;text-wrap:balance}
.auth p{margin:0 0 6px}
.auth .btns .btn{flex:1}
.dots{display:flex;gap:6px;margin-bottom:14px}
.dots i{width:28px;height:4px;border-radius:2px;background:var(--line)}
.dots i.on{background:var(--matcha)}
.choice{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer;text-align:left;background:var(--surface);width:100%;margin-top:8px}
.choice.on{border-color:var(--matcha);box-shadow:inset 0 0 0 1px var(--matcha);background:var(--matcha-soft)}
.choice small{display:block;color:var(--muted);font-size:13px}
.pchk{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;margin-top:8px;cursor:pointer}
.pchk input{accent-color:var(--matcha);width:17px;height:17px}
.pchk small{color:var(--muted);margin-left:auto;font-size:12.5px}
.av.lg{width:56px;height:56px;font-size:24px}
.code{font:600 18px var(--f-mono);letter-spacing:.08em;background:var(--surface-2);border-radius:10px;padding:6px 12px}
.confirmbox{background:var(--urgent-soft);border-radius:12px;padding:12px 14px;margin-top:12px;font-size:14px}
.btn.danger{color:var(--urgent);border-color:var(--urgent)}

/* storage places editor + photo measure */
.places{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.place{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 10px;align-items:center}
.place input[type=text],.place select,.newp input,.newp select{border:1px solid var(--line);background:var(--app-bg);border-radius:9px;padding:7px 10px;font-size:14px;min-width:0}
.place .pn{font-weight:600}
.place .row2{grid-column:1 / -1;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;font-size:13px;color:var(--muted)}
.place input[type=range]{flex:1 1 110px;accent-color:var(--matcha)}
.place .rm{grid-column:1 / -1;background:var(--soon-soft);border-radius:10px;padding:8px 10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px}
.place .rm select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:4px 6px}
.newp{margin-top:18px;border-top:1px solid var(--line);padding-top:16px;display:flex;flex-direction:column;gap:8px}
.newp .r{display:flex;gap:8px;flex-wrap:wrap}
.newp .r input{flex:1 1 160px}
.bar.est{outline:1.5px dashed var(--muted);outline-offset:1px}
.bar.est i{opacity:.75}
.shot{position:relative;border-radius:14px;overflow:hidden;margin-top:14px;background:var(--surface-2);aspect-ratio:4 / 3;max-width:100%}
.shot img,.shot svg{display:block;width:100%;height:100%;object-fit:cover}
.shot .sweep{position:absolute;left:0;right:0;top:0;height:3px;background:var(--matcha);box-shadow:0 0 14px var(--matcha);animation:sweep 1.3s ease-in-out infinite alternate}
@keyframes sweep{from{top:0}to{top:calc(100% - 3px)}}
.shot .cap{position:absolute;left:10px;bottom:10px;background:var(--toast-bg);color:var(--toast-fg);font:500 12px var(--f-mono);padding:4px 8px;border-radius:7px}
.measure-out{font:700 30px var(--f-display);margin:14px 0 2px}
.filebtn{position:relative;overflow:hidden;display:inline-flex;align-items:center}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.fld input[type=range]{padding:0;border:0;background:none;accent-color:var(--matcha)}
@media (prefers-reduced-motion:reduce){.shot .sweep{animation:none;top:50%}}

/* ---------- responsive ---------- */
@media (max-width:1239px){
  .app.with-notes{grid-template-columns:236px minmax(0,1fr)}
  .app.authmode.with-notes{grid-template-columns:minmax(0,1fr)}
  .notes{position:fixed;top:0;right:0;bottom:0;width:min(380px,100%);z-index:55;box-shadow:-24px 0 48px -24px var(--shadow)}
  .notes .nclose{display:block;position:absolute;top:14px;right:14px}
}
@media (max-width:980px){
  .mail,.shot.photo{position:static}
  .cols2{grid-template-columns:minmax(0,1fr)}
  .rcgrid{grid-template-columns:minmax(0,1fr)}
  .paper{position:static;max-width:320px;transform:none}
  .fh,.fr{grid-template-columns:minmax(0,1fr) auto}
  .fh{display:none}
  .fr .fx{display:none}
  .fr .fn small{display:block}
}
@media (max-width:760px){
  .app,.app.with-notes{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;z-index:50;flex-direction:row;padding:6px 4px;padding-bottom:calc(6px + env(safe-area-inset-bottom, 0px));border-right:0;border-top:1px solid var(--line)}
  .brand,.me{display:none}
  .nav{flex-direction:row;width:100%;gap:0}
  .nv{flex:1;flex-direction:column;gap:2px;padding:6px 2px;font-size:10.5px;justify-content:center;align-items:center;border-radius:10px;min-width:0}
  .nv .l{display:none}
  .nv .s{display:block}
  .nv .badge{position:absolute;transform:translate(12px,-10px);margin:0;font-size:9.5px;padding:0 5px}
  .nv{position:relative}
  .main{padding-block:18px 110px}
  .toast{bottom:84px}
  .demo-pill{bottom:80px}
  .weekgrid{grid-template-columns:minmax(0,1fr)}
  .dcol{min-height:0}

/* dates: day numbers are days of October 2026 (0 = 30 Sep, 32 = 1 Nov). 1 Oct 2026 is a Thursday. */
const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const dowOf = d => DOW[(((d - 1 + 4) % 7) + 7) % 7];
const short = d => d >= 1 && d <= 31 ? `${d} Oct` : d <= 0 ? `${30 + d} Sep` : `${d - 31} Nov`;
const fmt = d => `${dowOf(d)} ${short(d)}`;
const relDay = d => d === S.day ? 'today' : d === S.day + 1 ? 'tomorrow' : fmt(d);

function lastGood(it){ const t = it.date; if (t.t === 'useby' || t.t === 'bb') return t.d ?? Infinity; if (t.t === 'est') return t.lo; return Infinity; }
function urg(it){ return lastGood(it) - S.day; }
function rank(it){ const g = urg(it); const t = it.date.t; return (isFinite(g) ? g : 999) * 10 + (t === 'useby' ? 0 : t === 'bb' ? 1 : t === 'est' ? 2 : 3); }
function dateInfo(it){
  const t = it.date, today = S.day;
  if (t.t === 'useby'){ const x = t.d - today; return {txt: x < 0 ? 'Past use-by' : x === 0 ? 'Use by today' : x === 1 ? 'Use by tomorrow' : `Use by ${short(t.d)}`, cls: x <= 1 ? 'c-urgent' : x <= 3 ? 'c-soon' : 'c-plain', tc: x <= 1 ? 't-u' : x <= 3 ? 't-s' : 't-n', lab:'on pack'}; }
  if (t.t === 'bb'){ if (t.d == null) return {txt:`Best before ${t.far}`, cls:'c-plain', tc:'t-n', lab:'on pack'}; const x = t.d - today; return {txt: x < 0 ? 'Past best-before' : x === 0 ? 'Best before today' : x === 1 ? 'Best before tomorrow' : `Best before ${short(t.d)}`, cls: x <= 1 ? 'c-soon' : 'c-plain', tc: x <= 1 ? 't-s' : 't-n', lab:'on pack'}; }
  if (t.t === 'est'){ const a = Math.max(t.lo - today, 0), b = t.hi - today; let txt; if (b <= 0) txt = 'Check it today'; else if (a === 0) txt = `≈ up to ${b} day${b > 1 ? 's' : ''}`; else if (a === b) txt = `≈ ${a} day${a > 1 ? 's' : ''}`; else txt = `≈ ${a}–${b} days`; return {txt, cls:'c-est' + (a <= 1 ? ' u' : a <= 3 ? ' s' : ''), tc: a <= 1 ? 't-u' : a <= 3 ? 't-s' : 't-n', lab:'estimate'}; }
  if (t.t === 'frozen'){ const n = today - t.on, w = Math.floor(n / 7); return {txt: n <= 0 ? 'Frozen today' : n < 7 ? `Frozen ${n} day${n > 1 ? 's' : ''}` : `Frozen ${w} wk`, cls:'c-frost' + (w >= 4 ? ' c-old' : ''), tc:'t-f', lab:`since ${short(t.on)}`}; }
  return {txt: t.note || 'No date', cls:'c-none', tc:'t-n', lab:''};
}
function chip(it){ const i = dateInfo(it); return `<span class="chip ${i.cls}">${esc(i.txt)}${i.lab ? `<i>${esc(i.lab)}</i>` : ''}</span>`; }

/* ===================== data actions ===================== */
function start(p, day, clock){
  D[p] = JSON.parse(JSON.stringify(BASE[p]));
  Object.assign(S, {p, day, clock, tab:'today', sub:null, drawer:null, loc:'fridge', own:'all', q:'', banner:null, notif:null, shopAlert:null, toast:null, planSnap:null, rm:null, meas:null, rcKey:'receipt', edit:null, ph:null, auth:'in', as:null, acConfirm:null, acJoin:false});
  undoFn = null;
}
function nextCook(d){ const pl = P().plan; for (let x = Math.max(d + 1, S.day); x < P().weekStart + 7; x++){ if (pl[x] && pl[x].m === 'cook') return x; } return null; }
function altDay(it){ const pl = P().plan, lg = lastGood(it); for (let x = Math.min(lg, P().weekStart + 6); x >= S.day; x--){ if (pl[x] && pl[x].m === 'cook') return x; } return null; }
function changeDays(list, silent){
  const pl = P().plan;
  if (!silent) S.planSnap = JSON.stringify(pl);
  list.forEach(([d, m]) => { if (pl[d]) pl[d].m = m; });
  const moved = [];
  list.forEach(([d, m]) => {
    if (m === 'cook' || !pl[d]) return;
    pl[d].ids.splice(0).forEach(id => { const to = nextCook(d); if (to != null) pl[to].ids.push(id); moved.push({id, to}); });
  });
  if (silent){ S.banner = null; return; }
  const ms = moved.map(m => ({...m, it:item(m.id)})).filter(m => m.it);
  if (!ms.length){ S.banner = {msg:'Nothing was planned for that day, so nothing moved.', warns:[]}; return; }
  const tos = [...new Set(ms.map(m => m.to))];
  const msg = tos.length === 1 && tos[0] != null ? `${ms.length} item${ms.length > 1 ? 's' : ''} moved to ${fmt(tos[0])}.` : `${ms.length} items moved to the next days you cook.`;
  const warns = ms.filter(m => m.to == null || lastGood(m.it) < m.to).map(m => ({id:m.id, to:m.to, alt:altDay(m.it)}));
  const fresh = ms.filter(m => m.it.date.t !== 'frozen' && !warns.some(w => w.id === m.id)).sort((a, b) => rank(a.it) - rank(b.it))[0];
  S.banner = {msg, first: fresh ? `Use the ${fresh.it.n.toLowerCase()} first: ${dateInfo(fresh.it).txt.toLowerCase()}.` : null, warns};
}
function moveItem(id, d){
  const pl = P().plan; Object.values(pl).forEach(day => { day.ids = day.ids.filter(x => x !== id); });
  pl[d].ids.push(id);
  if (S.banner) S.banner.warns = S.banner.warns.filter(w => w.id !== id);
  toast(`${item(id).n} moved to ${fmt(d)}.`);
}
function plannedDay(id){ const pl = P().plan; for (const d of Object.keys(pl)){ if (+d >= S.day && pl[d].ids.includes(id)) return +d; } return null; }
function snapshot(){ const p = P(); const s = JSON.stringify({items:p.items, plan:p.plan, locs:p.locs}); return () => { const o = JSON.parse(s); p.items = o.items; p.plan = o.plan; p.locs = o.locs; if (!locOf(S.loc) && p.locs[0]) S.loc = p.locs[0].id; }; }
let placeSeq = 0;
function addPlace(n, kind){ const id = 'p' + Date.now() + '-' + (++placeSeq); P().locs.push({id, n, kind, sub:'', full:null}); S.loc = id; toast(`${n} added. Its food shows under Food at home.`); }
function startScan(file){
  const m = S.meas; m.img = file ? URL.createObjectURL(file) : null; m.phase = 'scan';
  m.val = file ? 55 + (file.size % 7) * 5 : 70; /* simulated: this prototype does not really analyse the photo */
  setTimeout(() => { if (S.meas && S.meas.phase === 'scan'){ S.meas.phase = 'done'; render(); } }, 1500);
}
function removeItem(id, msg){
  const back = snapshot(); const p = P();
  p.items = p.items.filter(i => i.id !== id);
  Object.values(p.plan).forEach(day => { day.ids = day.ids.filter(x => x !== id); });
  S.drawer = null; toast(msg, back);
}
function confirmReceipt(silent, key){
  key = key || 'receipt';
  const p = P(); const R = p[key]; if (!R || R.done) return {n:0};
  let n = 0, lastLoc = null;
  R.lines.filter(keepLine).forEach(l => {
    let date = l.date;
    if (!date) date = (l.dateSet || silent) ? l.ask : {t:'est', lo:S.day + 2, hi:S.day + 4, basis:'typical for this food · add the pack date for a better reminder', guess:true};
    let loc = locOf(l.loc);
    if (!loc) loc = (date.t === 'frozen' && firstOf('frozen')) || firstOf('cold') || p.locs[0];
    if (!loc) return;
    if (date.t === 'frozen' && loc.kind !== 'frozen') date = {t:'est', lo:S.day + 1, hi:S.day + 2, basis:'fresh food · in the fridge'};
    if (loc.kind === 'frozen' && date.t !== 'frozen' && date.t !== 'bb') date = {t:'frozen', on:S.day};
    p.items.push({id:l.id, n:l.n, q: l.split && l.split.on && loc.kind === 'frozen' ? `${l.split.n} bags × ${l.split.each}` : l.q, loc:loc.id, own:l.own || 'mine', date, tip:l.tip, keepNote:l.keepNote, where: loc.kind === 'frozen' ? 'top drawer' : undefined});
    n++; lastLoc = loc.id;
  });
  R.done = true;
  const sa = key === 'receipt' ? p.spaceAfter : (R.spaceAfter || {});
  p.locs.forEach(l => { const d = sa[l.id]; if (d && l.full != null) l.full = Math.min(100, l.full + d); });
  return {n, loc:lastLoc};
}
function makePhoto(img){
  const d = S.day; const stamp = Date.now();
  return {when: fmt(d), img, lines: BASE[S.p].photoLines.map((l, i) => {
    const o = JSON.parse(JSON.stringify(l)); o.id = 'h' + stamp + '-' + i; o.mark = i + 1;
    if (o.date && o.date.t === 'est'){ o.date.lo += d; o.date.hi += d; o.date.basis = o.date.basis.replace('{day}', fmt(d)); }
    if (o.date && o.date.t === 'frozen') o.date.on = d;
    if (o.ask && o.ask.d != null) o.ask.d += d;
    return o; })};
}
function startPhoto(file){
  S.ph = {phase:'scan', img: file ? URL.createObjectURL(file) : null};
  setTimeout(() => { if (S.ph && S.ph.phase === 'scan'){ P().photo = makePhoto(S.ph.img); S.ph = null; S.drawer = null; goTab('add'); S.sub = 'receipt'; S.rcKey = 'photo'; S.edit = null; render(); } }, 1600);
}

function drawerItem(id){

  else if (t.t === 'bb') expl = "Best-before date from the pack. It's usually still safe after this date, but may not taste as good.";
  else if (t.t === 'est') expl = `There's no date from the pack, so this is an estimate from: ${t.basis}. It's a guide, not a promise. Check how it looks and smells.`;
  else if (frozen) expl = `In the freezer since ${fmt(t.on)} (${S.day - t.on} days). Frozen food stays safe while it's frozen, but quality drops the longer it's there.${it.keepNote ? ' ' + it.keepNote : ''} Thaw it in the fridge, not on the bench. If it smells sour after thawing, throw it out.`;

  acDeleteGo(){ S.acConfirm = null; S.auth = 'out'; S.as = {step:'welcome', places:{fridge:true, freezer:true, pantry:true}, extra:[], house:'alone'}; toast('Account deleted (demo). Nothing real was removed.'); },
  step(a){ const [p, i] = a.split(':'); STEPS[p][+i].go(); S.step = a; try { window.scrollTo(0, 0); } catch(e){} },
  reset(){ start(S.p, BASE[S.p].today, BASE[S.p].clock); S.step = null; toast('Example data reset.'); },
  notes(){ S.notesOpen = !S.notesOpen; store.set('notes', S.notesOpen ? '1' : '0'); },
  ntab(a){ S.notesTab = a; },
  demoHide(){ S.demoHidden = true; },
  demoShow(){ S.demoHidden = false; },
  planchg(){ S.drawer = {k:'planchg'}; },
  pc(a){
    const d = S.day; S.drawer = null;
    if (a === 'plan'){ goTab('plan'); return; }
    const list = a === 'away' ? [0,1,2].map(i => [d + i, 'out']).filter(([x]) => P().plan[x]) : [[d, a]];
    changeDays(list);
  },
  undoPlan(){ if (S.planSnap){ P().plan = JSON.parse(S.planSnap); S.planSnap = null; S.banner = null; toast('Plan put back the way it was.'); } },
  moveTo(a){ const [id, d] = a.split('|'); moveItem(id, +d); },
  goReceipt(){ goTab('add'); S.sub = 'receipt'; S.rcKey = 'receipt'; S.edit = null; },
  add(a){
    if (a === 'receipt'){ goTab('add'); S.sub = 'receipt'; S.rcKey = 'receipt'; S.edit = null; }
    else if (a === 'photo'){ S.ph = {phase:'pick'}; S.drawer = {k:'photoPick'}; }
    else if (a === 'email') S.drawer = {k: P().emailOn ? 'emailFound' : 'emailConsent'};
    else if (a === 'type') S.drawer = {k:'quickadd'};
    else if (a === 'account'){ if (P().connected) toast('Already linked. You can unlink it in Sharing & settings.'); else S.drawer = {k:'consent'}; }
    else toast('Barcode scanning is not built in this prototype yet.');
  },
  photoDemo(){ startPhoto(null); },
  emailConnect(){
    const p = P(); const names = [['em-c1','Online supermarket orders'],['em-c2','In-store e-receipts'],['em-c3','Meal-kit and delivery apps']];
    p.emailSrc = names.filter(([id]) => { const el = document.getElementById(id); return el ? el.checked : id !== 'em-c3'; }).map(([, n]) => n);
    if (!p.emailSrc.length){ toast('Tick at least one kind of sender.'); return; }
    p.emailOn = true; S.drawer = {k:'emailFound'}; toast('Email connected.');
  },
  emailReview(){ S.drawer = null; goTab('add'); S.sub = 'receipt'; S.rcKey = 'email'; S.edit = null; },
  emailOff(){ P().emailOn = false; toast('Email disconnected. Items you already added stay.'); },
  edOpen(a){ S.edit = a; },
  edCancel(){ S.edit = null; },
  edSave(a){
    const l = line(a); const n = $('#ed-n').value.trim(); if (n) l.n = n;
    const q = $('#ed-q').value.trim(); if (q) l.q = q;
    const loc = $('#ed-loc').value; const lk = (locOf(loc) || {}).kind; if ($('#ed-own')) l.own = $('#ed-own').value;
    const dv = $('#ed-date').value; const isFz = !!(l.date && l.date.t === 'frozen');
    if (lk === 'frozen'){ if (!isFz) l.prevDate = l.date; l.date = {t:'frozen', on:S.day}; }
    else if (dv === 'est') l.date = {t:'est', lo:S.day + 3, hi:S.day + 5, basis:`typical for ${l.n.toLowerCase()} · added ${fmt(S.day)}`};
    else if (dv[0] === 'u') l.date = {t:'useby', d:S.day + +dv.slice(1)};
    else if (dv[0] === 'b') l.date = {t:'bb', d:S.day + +dv.slice(1)};
    else if (isFz) l.date = l.prevDate || {t:'est', lo:S.day + 1, hi:S.day + 2, basis:'fresh food · in the fridge'};
    if (l.nonfood){ l.keep = true; if (l.date && l.date.t === 'none') l.date = {t:'est', lo:S.day + 3, hi:S.day + 5, basis:`typical for ${l.n.toLowerCase()} · added ${fmt(S.day)}`}; }
    l.loc = loc; l.ok = true; S.edit = null; toast(`${l.n} updated.`);
  },
  edRemove(a){ const l = line(a); l.skip = true; S.edit = null; toast(`${l.n} won't be added.`, () => { l.skip = false; }); },
  edRestore(a){ line(a).skip = false; },
  nfSkip(a){ line(a).skip = true; },
  nfKeep(a){ const l = line(a); l.keep = true; if (l.date && l.date.t === 'none') l.date = {t:'est', lo:S.day + 3, hi:S.day + 5, basis:`typical for ${l.n.toLowerCase()} · added ${fmt(S.day)}`}; },
  rcAlt(a){ const l = line(a); const nm = l.alt.charAt(0).toUpperCase() + l.alt.slice(1); const old = l.n; l.alt = old.toLowerCase(); l.n = nm; if (l.date && l.date.basis) l.date.basis = l.date.basis.replace(old.toLowerCase(), nm.toLowerCase()); l.ok = true; toast(`Changed to ${nm.toLowerCase()}.`); },
  backAdd(){ S.sub = null; S.edit = null; },
  rcLoc(a){
    const l = line(a); const order = P().locs.map(x => x.id); if (!order.length) return;
    const next = order[(order.indexOf(l.loc) + 1) % order.length];
    const isFz = !!(l.date && l.date.t === 'frozen');
    if (locOf(next).kind === 'frozen'){ if (!isFz) l.prevDate = l.date; l.date = {t:'frozen', on:S.day}; }
    else if (isFz){ l.date = l.prevDate || {t:'est', lo:S.day + 1, hi:S.day + 2, basis:'fresh food · in the fridge'}; }
    l.loc = next;
  },
  rcOwn(a){ const l = line(a); l.own = l.own === 'shared' ? 'mine' : 'shared'; },
  rcOk(a){ line(a).ok = true; },
  rcFix(a){ S.edit = a; },
  rcDate(a){ const l = line(a); l.dateSet = true; l.date = l.ask; toast(`Pack date added for ${l.n.toLowerCase()}.`); },
  rcSplit(a){ const l = line(a); l.split.on = !l.split.on; },
  rcConfirm(){ if (S.edit) return; const r = confirmReceipt(false, S.rcKey); goTab('food'); if (r.loc) S.loc = r.loc; toast(`${r.n} item${r.n === 1 ? '' : 's'} added. You can change any of them later.`); },
  consent(a){ S.drawer = null; if (a === 'yes'){ P().connected = true; toast('Linked. New orders will show up under Needs a look.'); } },
  unlink(){ P().connected = false; toast('Unlinked. Items you already added stay until you remove them.'); },
  invite(){ toast('Inviting housemates is not built in this prototype yet.'); },
  together(a){ const [w, t] = a.split('|'); toast(`${w} will see your suggestion: shop together ${t}.`); },
  set(a){ if (a === 'x') return; const st = P().set; st[a] = !st[a]; },
  qaAdd(){
    const n = $('#qa-name').value.trim(); if (!n){ toast('Type what it is first.'); return; }
    const loc = $('#qa-loc').value; if (!loc){ toast('Add a storage place first.'); return; }
    const own = $('#qa-own') ? $('#qa-own').value : 'mine'; const dv = $('#qa-date').value;
    const date = (locOf(loc) || {}).kind === 'frozen' ? {t:'frozen', on:S.day} : dv === 'est' ? {t:'est', lo:S.day + 3, hi:S.day + 5, basis:`typical for this kind of food · added ${fmt(S.day)}`} : {t:'useby', d:S.day + (+dv)};
    P().items.push({id:'u' + Date.now(), n, q:'1', loc, own, date}); S.drawer = null; goTab('food'); S.loc = loc; toast(`${n} added to the ${lowerFirst(locName(loc))}.`);
  },
  iAmt(a){ item(S.drawer.id).amt = a; },
  iSome(){ const it = item(S.drawer.id); const Q = ['Full','Most','Half','Low']; it.amt = Q[Math.min(Q.indexOf(it.amt || 'Full') + 1, 3)]; toast(`${it.n}: ${it.amt.toLowerCase()} left.`); },
  iUp(){ removeItem(S.drawer.id, 'Marked as used up.'); },
  iToss(){ removeItem(S.drawer.id, 'Removed from your list.'); },
  iOpen(){ item(S.drawer.id).opened = S.day; toast('Marked as opened today.'); },
  iFreeze(){ if (!hasFreezer()) return; const back = snapshot(); const it = item(S.drawer.id); it.loc = firstOf('frozen').id; it.where = 'top drawer'; it.date = {t:'frozen', on:S.day}; toast(`${it.n} moved to the freezer.`, back); },
  iThaw(){ const back = snapshot(); const it = item(S.drawer.id); const to = firstOf('cold') || P().locs.find(l => l.kind !== 'frozen'); if (to) it.loc = to.id; it.where = undefined; it.date = {t:'est', lo:S.day + 1, hi:S.day + 2, basis:'thawed meat · in the fridge'}; toast(`Moved to the fridge to thaw. Cook it by ${fmt(S.day + 2)}.`, back); },
  iDate(){ toast('A date and details editor opens here in the full version.'); },
  iPlanToday(){ const pl = P().plan[S.day]; if (pl && pl.m === 'cook'){ pl.ids.push(S.drawer.id); toast('Added to today.'); } },
  sBuy(a){ P().shop.find(x => x.id === a).who = P().name; },
  sDone(a){ const s = P().shop.find(x => x.id === a); s.done = !s.done; },
  sSug(a){ suggestAlert(a); },
  sAlert(a){ const al = S.shopAlert; S.shopAlert = null; const x = al && al.acts[+a]; if (x && x.f) x.f(); },
  sAdd(){
    const inp = $('#shop-in'); const v = inp.value.trim(); if (!v) return; inp.value = '';
    const hit = P().suggest.find(s => v.toLowerCase().includes(s.k.replace(/s$/, '')));
    if (hit) suggestAlert(hit.k); else addShop(v, 'mine');
  },
  places(){ S.rm = null; S.drawer = {k:'places'}; },
  placeNew(){ S.rm = null; S.drawer = {k:'places'}; setTimeout(() => { const el = document.getElementById('np-name'); if (el) el.focus(); }, 60); },
  pRm(a){
    const p = P(); if (p.locs.length === 1){ toast('Keep at least one place. Add another one first.'); return; }
    if (p.items.some(i => i.loc === a)){ S.rm = a; return; }
    const back = snapshot(); const nm = locOf(a).n; p.locs = p.locs.filter(l => l.id !== a); if (S.loc === a) S.loc = p.locs[0].id; toast(`${nm} removed.`, back);
  },
  pRmGo(a){
    const p = P(); const to = $('#rm-to').value; const tk = locOf(to); const back = snapshot(); const nm = locOf(a).n;
    p.items.forEach(i => { if (i.loc !== a) return; i.loc = to; i.where = undefined;
      if (tk.kind === 'frozen' && i.date.t !== 'frozen') i.date = {t:'frozen', on:S.day};
      else if (tk.kind !== 'frozen' && i.date.t === 'frozen') i.date = {t:'est', lo:S.day + 1, hi:S.day + 2, basis:`taken out of the ${lowerFirst(nm)} on ${fmt(S.day)}`}; });
    p.locs = p.locs.filter(l => l.id !== a); S.rm = null; if (S.loc === a) S.loc = to;
    toast(`${nm} removed. Its food is now in the ${lowerFirst(tk.n)}.`, back);
  },
  pRmCancel(){ S.rm = null; },
  npAdd(){ const n = $('#np-name').value.trim(); if (!n){ toast('Give the place a name first.'); return; } addPlace(n, $('#np-kind').value); },
  npSug(a){ const [n, k] = a.split('|'); addPlace(n, k); },
  measure(a){ S.meas = {id:a, phase:'pick', img:null, val:0, back: !!(S.drawer && S.drawer.k === 'places')}; S.drawer = {k:'measure'}; },
  measDemo(){ startScan(null); },
  measRetake(){ if (S.meas.img) try { URL.revokeObjectURL(S.meas.img); } catch(e){} S.meas = {...S.meas, phase:'pick', img:null}; },
  measSave(){ const m = S.meas; const l = locOf(m.id); if (l){ l.full = m.val; l.src = 'photo'; l.mday = S.day; } if (m.img) try { URL.revokeObjectURL(m.img); } catch(e){} S.drawer = m.back ? {k:'places'} : null; S.meas = null; toast(`${l ? l.n : 'Place'} set to about ${m.val}% full.`); },
  undo(){ if (undoFn){ undoFn(); undoFn = null; S.toast = null; } }
};
const CHG = {
  ispot(a, v){ const it = item(a); if (it){ it.spot = v; toast(`${it.n} moved to the ${SPOTS[locOf(it.loc).kind].find(x => x[0] === v)[1].toLowerCase()}.`); } },
  acName(a, v){ const n = v.trim(); if (n){ P().name = n; toast('Name updated.'); } },
  pname(a, v){ const n = v.trim(); const l = locOf(a); if (n && l) l.n = n; },
  pkind(a, v){ const l = locOf(a); if (!l) return; l.kind = v; if (P().items.some(i => i.loc === a)) toast('Type changed. Dates for food already there stay as they are.'); },
  pfull(a, v){ const l = locOf(a); if (l){ l.full = +v; l.src = 'manual'; } },
  dmode(a, v){ const d = +a; if (d < S.day || P().plan[d].m === v) return; changeDays([[d, v]]); },
  looseAdd(a, v){ if (!v) return; P().plan[+v].ids.push(a); toast(`${item(a).n} added to ${fmt(+v)}.`); }
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const f = ACT[el.dataset.act]; if (!f) return;
  if (el.tagName !== 'INPUT') e.preventDefault();
  f(el.dataset.arg, el); render();
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'tg-tags'){ S.tags = t.checked; store.set('tags', S.tags ? '1' : '0'); render(); return; }
  if (t.id === 'ph-cam' || t.id === 'ph-lib'){ if (t.files && t.files[0]){ startPhoto(t.files[0]); render(); } return; }
  if (t.id === 'meas-file' || t.id === 'meas-lib'){ if (t.files && t.files[0] && S.meas){ startScan(t.files[0]); render(); } return; }
  if (t.dataset && t.dataset.change && CHG[t.dataset.change]){ CHG[t.dataset.change](t.dataset.arg, t.value); render(); }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'food-q'){ S.q = t.value; const l = $('#food-list'); if (l) l.innerHTML = foodBody(); }
  if (t.id === 'meas-val' && S.meas){ S.meas.val = +t.value; const lab = $('#meas-lab'); if (lab) lab.textContent = `≈ ${S.meas.val}% full`; }
  if (t.dataset && t.dataset.change === 'pfull'){ const l = locOf(t.dataset.arg); if (l){ l.full = +t.value; l.src = 'manual'; const lab = document.getElementById('pfl-' + l.id); if (lab) lab.textContent = l.full + '%'; } }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.id === 'shop-in'){ e.preventDefault(); ACT.sAdd(); render(); }
  if (e.key === 'Enter' && e.target.id === 'qa-name'){ e.preventDefault(); ACT.qaAdd(); render(); }
  if (e.key === 'Enter' && e.target.id === 'np-name'){ e.preventDefault(); ACT.npAdd(); render(); }
  if (e.key === 'Enter' && (e.target.id === 'au-email' || e.target.id === 'au-name')){ e.preventDefault(); ACT.auSend(); render(); }
  if (e.key === 'Enter' && e.target.id === 'au-code'){ e.preventDefault(); ACT.auCode(); render(); }
  if (e.key === 'Escape' && (S.drawer || S.notif)){ S.drawer = null; S.notif = null; render(); }
});
document.addEventListener('mouseover', e => {
  const r = e.target.closest && e.target.closest('.rc[data-l]');
  document.querySelectorAll('.pline.hl,.mline.hl,.pmark.hl').forEach(x => x.classList.remove('hl'));
  if (r) document.querySelectorAll(`.pline[data-l="${r.dataset.l}"],.mline[data-l="${r.dataset.l}"],.pmark[data-l="${r.dataset.l}"]`).forEach(x => x.classList.add('hl'));
});

/* boot */
start('may', 6, '18:10');
S.notesOpen = store.get('notes') != null ? store.get('notes') === '1' : (window.innerWidth >= 1240);
S.tags = store.get('tags') !== '0';
(function(){ const h = (location.hash || '').slice(1); if (TABS.includes(h)) S.tab = h; })();
render();
</script>

</body>
</html>
